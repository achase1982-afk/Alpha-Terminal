openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Alpha Terminal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Schwab OAuth authentication
  - name: market
    description: Market data from Schwab
  - name: ai
    description: AI analysis via Claude
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/url:
    get:
      operationId: getAuthUrl
      tags: [auth]
      summary: Get Schwab OAuth URL
      responses:
        "200":
          description: Auth URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUrlResponse"

  /auth/callback:
    post:
      operationId: exchangeCode
      tags: [auth]
      summary: Exchange auth code for tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeCodeRequest"
      responses:
        "200":
          description: Token exchange result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      operationId: refreshToken
      tags: [auth]
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Refreshed tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/status:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Check if credentials are configured
      responses:
        "200":
          description: Auth status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatusResponse"

  /market/quote:
    get:
      operationId: getQuote
      tags: [market]
      summary: Get real-time quote for a symbol
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: accessToken
          in: query
          required: false
          description: Deprecated — server uses stored Schwab tokens when omitted
          schema:
            type: string
      responses:
        "200":
          description: Quote data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteResponse"

  /market/history:
    get:
      operationId: getPriceHistory
      tags: [market]
      summary: Get price history (candles)
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: accessToken
          in: query
          required: false
          description: Deprecated — server uses stored Schwab tokens when omitted
          schema:
            type: string
        - name: periodType
          in: query
          required: false
          schema:
            type: string
            default: "month"
        - name: period
          in: query
          required: false
          schema:
            type: number
            default: 3
        - name: frequencyType
          in: query
          required: false
          schema:
            type: string
            default: "daily"
        - name: frequency
          in: query
          required: false
          schema:
            type: number
            default: 1
      responses:
        "200":
          description: Candle data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceHistoryResponse"

  /market/options:
    get:
      operationId: getOptionChain
      tags: [market]
      summary: Get option chain for a symbol
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: accessToken
          in: query
          required: false
          description: Deprecated — server uses stored Schwab tokens when omitted
          schema:
            type: string
        - name: contractType
          in: query
          required: false
          schema:
            type: string
            default: "ALL"
        - name: daysToExpiration
          in: query
          required: false
          schema:
            type: number
            default: 30
        - name: strikeCount
          in: query
          required: false
          schema:
            type: number
            description: Number of strikes above and below ATM to return from broker
      responses:
        "200":
          description: Option chain data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionChainResponse"

  /ai/technical-analysis:
    post:
      operationId: runTechnicalAnalysis
      tags: [ai]
      summary: Run AI technical analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TechnicalAnalysisRequest"
      responses:
        "200":
          description: AI analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnalysisResponse"

  /ai/options-analysis:
    post:
      operationId: runOptionsAnalysis
      tags: [ai]
      summary: Run AI options analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OptionsAnalysisRequest"
      responses:
        "200":
          description: AI options analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnalysisResponse"

  /ai/chat:
    post:
      operationId: runChatQuery
      tags: [ai]
      summary: Stream AI chat turn (SSE) with tool-based context
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Server-sent events (text, tool_call_start, tool_call_end, done)
          content:
            text/event-stream:
              schema:
                type: string

  /chat/threads:
    get:
      operationId: listChatThreads
      tags: [ai]
      summary: List chat threads for the signed-in user
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Thread list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatThreadsResponse"

  /chat/threads/{threadId}/messages:
    get:
      operationId: listChatThreadMessages
      tags: [ai]
      summary: Messages for a chat thread
      parameters:
        - name: threadId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Message list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessagesResponse"

  /ai/models:
    get:
      operationId: getAvailableModels
      tags: [ai]
      summary: Get available AI models
      responses:
        "200":
          description: List of models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AuthUrlResponse:
      type: object
      properties:
        url:
          type: string
        configured:
          type: boolean
      required:
        - url
        - configured

    ExchangeCodeRequest:
      type: object
      properties:
        code:
          type: string
        redirectUri:
          type: string
      required:
        - code
        - redirectUri

    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: number
        tokenType:
          type: string
      required:
        - accessToken
        - refreshToken
        - expiresIn
        - tokenType

    AuthStatusResponse:
      type: object
      properties:
        configured:
          type: boolean
        claudeConfigured:
          type: boolean
      required:
        - configured
        - claudeConfigured

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error
        - message

    QuoteResponse:
      type: object
      properties:
        symbol:
          type: string
        description:
          type: string
        last:
          type: number
        bid:
          type: number
        ask:
          type: number
        change:
          type: number
        changePct:
          type: number
        volume:
          type: number
        high:
          type: number
        low:
          type: number
        fiftyTwoWeekHigh:
          type: number
        fiftyTwoWeekLow:
          type: number
        peRatio:
          type: number
        nextEarningsDate:
          type: string
        error:
          type: string
      required:
        - symbol

    Candle:
      type: object
      properties:
        datetime:
          type: string
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number
      required:
        - datetime
        - open
        - high
        - low
        - close
        - volume

    PriceHistoryResponse:
      type: object
      properties:
        symbol:
          type: string
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        error:
          type: string
      required:
        - symbol
        - candles

    OptionContract:
      type: object
      properties:
        strike:
          type: number
        expiration:
          type: string
        bid:
          type: number
        ask:
          type: number
        bidSize:
          type: number
        askSize:
          type: number
        last:
          type: number
        volume:
          type: number
        openInterest:
          type: number
        iv:
          type: number
        delta:
          type: number
        gamma:
          type: number
        theta:
          type: number
        vega:
          type: number
        dte:
          type: number
      required:
        - strike
        - expiration

    OptionChainResponse:
      type: object
      properties:
        symbol:
          type: string
        underlyingPrice:
          type: number
        calls:
          type: array
          items:
            $ref: "#/components/schemas/OptionContract"
        puts:
          type: array
          items:
            $ref: "#/components/schemas/OptionContract"
        error:
          type: string
      required:
        - symbol
        - calls
        - puts

    TechnicalAnalysisFundamentals:
      type: object
      description: Optional fundamentals block for streaming technical analysis
      properties:
        marketCap:
          type: number
          nullable: true
        sharesOutstanding:
          type: number
          nullable: true
        peRatio:
          type: number
          nullable: true
        eps:
          type: number
          nullable: true
        beta:
          type: number
          nullable: true
        dividendYield:
          type: number
          nullable: true
        high52:
          type: number
          nullable: true
        low52:
          type: number
          nullable: true

    TechnicalAnalysisRequest:
      type: object
      properties:
        quote:
          $ref: "#/components/schemas/QuoteResponse"
        candles:
          type: array
          items:
            $ref: "#/components/schemas/Candle"
        model:
          type: string
        temperature:
          type: number
        customPrompt:
          type: string
        fundamentals:
          $ref: "#/components/schemas/TechnicalAnalysisFundamentals"
      required:
        - quote
        - candles

    OptionsAnalysisRequest:
      type: object
      properties:
        quote:
          $ref: "#/components/schemas/QuoteResponse"
        chain:
          $ref: "#/components/schemas/OptionChainResponse"
        model:
          type: string
        temperature:
          type: number
        customPrompt:
          type: string
      required:
        - quote
        - chain

    ChatRequest:
      type: object
      properties:
        thread_id:
          type: string
          format: uuid
        message:
          type: string
        model:
          type: string
        symbol:
          type: string
          description: Ambient page symbol (e.g. GOOGL) — not a routing override
      required:
        - message

    ChatThread:
      type: object
      properties:
        id:
          type: string
          format: uuid
        symbol:
          type: string
          nullable: true
        title:
          type: string
        summary:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
        - updatedAt

    ChatThreadsResponse:
      type: object
      properties:
        threads:
          type: array
          items:
            $ref: "#/components/schemas/ChatThread"
      required:
        - threads

    ChatMessage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        toolCalls:
          type: object
          nullable: true
        toolResults:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - role
        - content
        - createdAt

    ChatMessagesResponse:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - messages

    AiAnalysisResponse:
      type: object
      properties:
        response:
          type: string
        error:
          type: string
      required:
        - response

    ModelsResponse:
      type: object
      properties:
        models:
          type: array
          items:
            type: string
      required:
        - models
