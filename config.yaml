# ── Swing Engine Configuration ────────────────────────────────────────────────
# Single source of truth for the deterministic TypeScript trading engine.
# No code changes needed to tune the strategy — edit here and restart.

# ── Symbols & account ─────────────────────────────────────────────────────────
symbol: ""           # Legacy single-symbol field (kept = symbols[0]); optional.
symbols: []          # Watch list — the engine runs each symbol independently.
                     #   e.g.  symbols: ["AAPL", "MSFT", "NVDA"]
accountHash: ""      # Schwab account hash — REQUIRED. The engine places real orders. Never auto-resolved.
setup: "swing"       # Active strategy: "swing" (continuous) | "orb" (legacy breakout).

# ── Swing setup ───────────────────────────────────────────────────────────────
bodyAvgWindow: 10            # Rolling window for body averaging (bars).
volAvgWindow: 20             # Trailing window for volume averaging (bars).
directionLookback: 5         # Bars used for the short-term direction read.
vwapBandAtrMult: 2.0         # Range rails = VWAP ± (this × ATR).
belowVwapStretchThreshold: 0.6  # 0–1: how far toward the lower rail price must stretch to qualify.
volDryingThreshold: 1.0      # Legacy — unused by the confirmation entry (kept for back-compat).
reversalVolRatioMin: 1.2     # Turn-bar must trade ≥ this × its avg volume — confirms real demand, not a fake bounce.
rsiEntryMin: 25              # Entry RSI lower gate.
rsiEntryMax: 55              # Entry RSI upper gate.
swingTargetRail: "vwap"      # Take profit toward "vwap" or the "upper" rail.
stopBelowRailAtrMult: 0.5    # Hard stop = reversal-bar low − (this × ATR).
volumeProfileLookbackDays: 20  # Sessions of history used for the RVOL baseline.

# ── Opening range (legacy ORB setup only) ─────────────────────────────────────
orWindowMinutes: 15
rvolThreshold: 1.5
stopMode: "or_low"           # "or_low" | "atr"
atrK: 1.0
rTarget: 1.5
minTargetOverSpread: 3       # Target must be ≥ N × spread to be worth placing.

# ── Position sizing ───────────────────────────────────────────────────────────
startingEquity: 1000         # Account equity used for % sizing. Set to your real allocation.
riskPerTradePct: 0.01        # Max risk per trade as % of equity (1% of $1,000 = $10).
maxPositionSizePct: 0.20     # Max position size as % of equity (20% = $200).

# ── Risk management ───────────────────────────────────────────────────────────
dailyLossHaltPct: 0.03       # Halt if day P&L ≤ −3% of equity.
lossStreakLimit: 3           # Halt after N consecutive losses.
cooldownMinutes: 60          # Cooldown after a loss streak.
tradesPerDay: 40             # Max trades/day across all symbols (continuous swing needs headroom).
enableShorts: false          # Short selling — not yet implemented (long-only).

# ── Execution ─────────────────────────────────────────────────────────────────
# The engine is always live — every signal places a real Schwab bracket order.
cancelTimeoutSeconds: 30     # Cancel an unfilled entry limit after this many seconds.
timeStop: "15:55"            # Flatten all positions at/after this ET time.

# ── Storage ───────────────────────────────────────────────────────────────────
logDb: "autotrader/engine.db"   # SQLite file for evaluations/signals/fills/exits.
