kind = "web"
previewPath = "/"
title = "Alpha Terminal"
version = "1.0.0"
id = "artifacts/alpha-terminal"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18262

[services.development]
run = "pnpm --filter @workspace/alpha-terminal run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/alpha-terminal", "run", "build" ]
publicDir = "artifacts/alpha-terminal/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18262"
BASE_PATH = "/"
