<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Alpha Terminal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Alpha Terminal" />
    <meta name="theme-color" content="#070707" />

    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link href="https://fonts.bunny.net/css?family=inter:300,400,500,600,700&display=swap" rel="stylesheet" />

    <style>
      @font-face {
        font-family: 'InterVariable';
        src: url('/fonts/InterVariable.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      *, *::before, *::after {
        font-family: 'InterVariable', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif !important;
      }
      .at-glance {
        font-family: 'InterVariable', 'Inter', -apple-system, system-ui, sans-serif !important;
        font-feature-settings: "tnum" 1, "ss01" 1, "cv09" 1;
        letter-spacing: 0;
      }
      .font-mono {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif !important;
        font-weight: 500 !important;
        font-variant-numeric: tabular-nums !important;
      }
      code, pre {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif !important;
      }
      .macro-symbol-label {
        font-weight: 700 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
