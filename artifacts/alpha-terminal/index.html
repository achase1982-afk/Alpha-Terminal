<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Alpha Terminal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Native system font stack — no external font requests, matches TOS crispness -->
    <style>
      *, *::before, *::after {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif !important;
      }
      /* Price/data numbers: use system sans-serif — monospace fonts have unfixable slashed zeros */
      .font-mono {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif !important;
        font-weight: 300 !important;
        font-variant-numeric: tabular-nums !important;
      }
      /* Even code blocks use sans-serif — zero slashes nowhere */
      code, pre {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif !important;
      }
      /* Macro card ticker labels stay bold — intentional hierarchy */
      .macro-symbol-label {
        font-weight: 700 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
