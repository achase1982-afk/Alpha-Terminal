# Railway: strategist-worker (Strategist V3 job runner).
# Service config path: artifacts/strategist-worker/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "artifacts/strategist-worker/Dockerfile"
watchPatterns = ["artifacts/strategist-worker/**", "lib/db/**", "pnpm-lock.yaml"]

[deploy]
startCommand = "pnpm --filter @workspace/strategist-worker run start"
