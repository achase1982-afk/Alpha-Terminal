<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strategist Full Report (reference)</title>
  <style>
    :root {
      --bg: #0a0a0b;
      --surface: #161618;
      --surface-2: #202023;
      --line: rgba(255,255,255,.10);
      --txt: #ffffff;
      --amber: #f5a524;
      --green: #46d486;
      --red: #ff7a7a;
      --dim: rgba(255,255,255,.55);
    }
    body { margin: 0; background: var(--bg); color: var(--txt); font-family: -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; padding: 16px; }
    .drawer { background: var(--surface); border-radius: 0 0 18px 18px; max-width: 520px; margin: 0 auto; }
    .toggle { width: 100%; padding: 12px 18px; text-align: left; background: none; border: none; color: var(--amber); font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .body { padding: 0 18px 14px; }
    .section { padding-top: 15px; border-top: 1px solid var(--line); }
    .section:first-child { border-top: none; }
    .label { font-size: 11.5px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--amber); margin: 0 0 8px; }
    .label.red { color: var(--red); }
    .prose { font-size: 13.5px; line-height: 1.6; margin: 8px 0 0; }
    .panel { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; margin-top: 8px; }
    .chips { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; margin-top: 8px; font-size: 12.5px; font-weight: 600; }
    .chip-dim { color: var(--dim); font-weight: 500; }
    .footer { margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); }
  </style>
</head>
<body>
  <div class="drawer">
    <button class="toggle" type="button">Read full report ▸</button>
    <div class="body">
      <section class="section">
        <h2 class="label">Provenance / Snapshot</h2>
        <div class="panel">
          <div class="chip-dim">Options chain · as of 2026-05-29</div>
          <p class="prose"><span style="font-size:22px;font-weight:700;color:var(--red)">56</span> confidence. Mid-tier read; size accordingly.</p>
        </div>
      </section>
      <section class="section">
        <h2 class="label">The Trade</h2>
        <div class="chips"><span class="chip-dim">Strategy</span> Bull Put Spread · <span class="chip-dim">Net credit</span> <span style="color:var(--green)">$1.30</span></div>
      </section>
      <section class="section">
        <h2 class="label red">The Bear Case</h2>
        <p class="prose">Structural critique and confidence caveat in prose only.</p>
      </section>
      <footer class="footer">Data & Assumptions — sources and modeled fields listed here.</footer>
    </div>
  </div>
</body>
</html>
